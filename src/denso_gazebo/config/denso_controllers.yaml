controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100  # Hz - Synchronized with Gazebo 100Hz physics step - WSL2 optimized

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

gz_ros2_control:
  ros__parameters:
    use_sim_time: true
    position_proportional_gain: 0.1

gz_ros_control:
  ros__parameters:
    use_sim_time: true
    position_proportional_gain: 0.1

arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    interpolate_from_desired_state: true
    allow_partial_joints_goal: false
    interpolation_method: splines
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 5.0
      # trajectory tolerance = 0.0 disables state tolerance aborts during drawing motions
      joint_1: { trajectory: 0.0, goal: 0.05 }
      joint_2: { trajectory: 0.0, goal: 0.05 }
      joint_3: { trajectory: 0.0, goal: 0.05 }
      joint_4: { trajectory: 0.0, goal: 0.05 }
      joint_5: { trajectory: 0.0, goal: 0.05 }
      joint_6: { trajectory: 0.0, goal: 0.05 }
