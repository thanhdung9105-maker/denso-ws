controller_manager:
  ros__parameters:
    update_rate: 500  # Hz - Synchronized with Gazebo 500Hz physics step (0.002s)

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

gz_ros2_control:
  ros__parameters:
    position_proportional_gain: 0.1

gz_ros_control:
  ros__parameters:
    position_proportional_gain: 0.1

arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    interpolate_from_desired_state: true
    allow_partial_joints_goal: false
    interpolation_method: splines
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 3.0
      joint_1: { trajectory: 0.25, goal: 0.08 }
      joint_2: { trajectory: 0.25, goal: 0.08 }
      joint_3: { trajectory: 0.25, goal: 0.08 }
      joint_4: { trajectory: 0.25, goal: 0.08 }
      joint_5: { trajectory: 0.25, goal: 0.08 }