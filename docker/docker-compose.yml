services:
  denso_ros2:
    build:
      context: .
      dockerfile: Dockerfile
    image: denso_ros2_jazzy:latest
    container_name: denso_ros2_container
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-}
      - XDG_RUNTIME_DIR=/mnt/wslg/runtime-dir
      - PULSE_SERVER=/mnt/wslg/PulseServer
      - LIBGL_ALWAYS_SOFTWARE=1
      - GALLIUM_DRIVER=llvmpipe
      - LP_NUM_THREADS=2
      - MESA_GL_VERSION_OVERRIDE=4.5
      - OGRE_RTT_MODE=FBO
      - QT_QPA_PLATFORM=xcb
      - QT_AUTO_SCREEN_SCALE_FACTOR=0
      - QT_SCALE_FACTOR=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /mnt/wslg:/mnt/wslg:ro
      - /home/dung/denso_ws:/home/dung/denso_ws:rw
    working_dir: /home/dung/denso_ws
    user: "1000:1000"
    command: bash
    stdin_open: true
    tty: true
